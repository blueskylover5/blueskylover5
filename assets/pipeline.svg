<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">The AI training lifecycle</title>
<desc id="d">Data, prepare, train, evaluate, deploy and monitor, joined in a continuous feedback loop. Each stage lights up in turn.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#0d1430"/><stop offset="1" stop-color="#170f36"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#67e8f9"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
<filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.mono{font-family:'Cascadia Code','SF Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.card{fill:#0c1329;stroke:#1f2b4d;stroke-width:1.5}
.hl{fill:#22d3ee;fill-opacity:.07;stroke:#67e8f9;stroke-width:2;opacity:0;animation:hl 6s linear infinite}
@keyframes hl{0%{opacity:0}4%{opacity:1}16%{opacity:1}20%{opacity:0}100%{opacity:0}}
.ic{fill:none;stroke:#67e8f9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#67e8f9;stroke-width:2;stroke-dasharray:4 5;animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-9}}
.loop{fill:none;stroke:#a78bfa;stroke-width:2;stroke-dasharray:6 7;animation:march2 1.2s linear infinite}
@keyframes march2{to{stroke-dashoffset:-13}}
.lab{font-size:15px;font-weight:700;fill:#e2e8f0;letter-spacing:.06em}
.sub{font-size:11px;fill:#7d8bb0}
.num{font-size:11px;fill:#3e4c70}
.led{animation:led 1.2s steps(1) infinite}
@keyframes led{50%{opacity:.2}}
.drop{animation:drop 1.5s ease-in infinite}
@keyframes drop{0%{transform:translateY(-10px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.pulse{fill:none;stroke:#67e8f9;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:14 120;stroke-dashoffset:16;animation:pf 1.8s linear infinite}
.pulse.b{animation-delay:.6s}
@keyframes pf{0%{stroke-dashoffset:16}40%{stroke-dashoffset:-100}100%{stroke-dashoffset:-100}}
.beat{fill:none;stroke:#34d399;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 100;animation:beat 2.2s linear infinite}
@keyframes beat{0%{stroke-dashoffset:100}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-out infinite}
@keyframes grow{0%{transform:scaleY(0)}30%{transform:scaleY(1)}90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
</style>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#67e8f9" stroke-opacity=".2"/>

<!-- connectors -->
<path class="flow" d="M206 111H233" marker-end="url(#ah)"/>
<path class="flow" d="M396 111H423" marker-end="url(#ah)"/>
<path class="flow" d="M586 111H613" marker-end="url(#ah)"/>
<path class="flow" d="M776 111H803" marker-end="url(#ah)"/>
<path class="flow" d="M966 111H993" marker-end="url(#ah)"/>
<path class="loop" d="M1075 190C1075 282 125 282 125 194" marker-end="url(#ah2)"/>
<text class="mono" x="600" y="302" font-size="12" fill="#a78bfa" text-anchor="middle">&#8635; continuous feedback &#183; evaluate &#183; retrain &#183; improve</text>

<!-- cards -->
<rect class="card" x="50" y="36" width="150" height="150" rx="14"/>
<rect class="card" x="240" y="36" width="150" height="150" rx="14"/>
<rect class="card" x="430" y="36" width="150" height="150" rx="14"/>
<rect class="card" x="620" y="36" width="150" height="150" rx="14"/>
<rect class="card" x="810" y="36" width="150" height="150" rx="14"/>
<rect class="card" x="1000" y="36" width="150" height="150" rx="14"/>
<rect class="hl" x="50" y="36" width="150" height="150" rx="14"/>
<rect class="hl" x="240" y="36" width="150" height="150" rx="14" style="animation-delay:1s"/>
<rect class="hl" x="430" y="36" width="150" height="150" rx="14" style="animation-delay:2s"/>
<rect class="hl" x="620" y="36" width="150" height="150" rx="14" style="animation-delay:3s"/>
<rect class="hl" x="810" y="36" width="150" height="150" rx="14" style="animation-delay:4s"/>
<rect class="hl" x="1000" y="36" width="150" height="150" rx="14" style="animation-delay:5s"/>

<g class="mono num">
<text x="64" y="58">01</text><text x="254" y="58">02</text><text x="444" y="58">03</text>
<text x="634" y="58">04</text><text x="824" y="58">05</text><text x="1014" y="58">06</text>
</g>
<g class="sans lab" text-anchor="middle">
<text x="125" y="150">DATA</text><text x="315" y="150">PREPARE</text><text x="505" y="150">TRAIN</text>
<text x="695" y="150">EVALUATE</text><text x="885" y="150">DEPLOY</text><text x="1075" y="150">MONITOR</text>
</g>
<g class="mono sub" text-anchor="middle">
<text x="125" y="171">collect &#183; clean</text><text x="315" y="171">tokenize &#183; split</text><text x="505" y="171">fine-tune &#183; align</text>
<text x="695" y="171">metrics &#183; red-team</text><text x="885" y="171">quantize &#183; serve</text><text x="1075" y="171">drift &#183; feedback</text>
</g>

<!-- 01 data: database -->
<g transform="translate(125 0)" class="ic">
<ellipse cx="0" cy="68" rx="24" ry="8"/>
<path d="M-24 68v38c0 4.4 10.7 8 24 8s24-3.6 24-8V68"/>
<path d="M-24 81c0 4.4 10.7 8 24 8s24-3.6 24-8M-24 94c0 4.4 10.7 8 24 8s24-3.6 24-8"/>
</g>

<!-- 02 prepare: funnel with falling samples -->
<g transform="translate(315 0)">
<path class="ic" d="M-28 72h56l-21 24v18l-14 7V96z"/>
<circle class="drop" cx="-12" cy="58" r="3" fill="#a5f3fc"/>
<circle class="drop" cx="0" cy="58" r="3" fill="#a5f3fc" style="animation-delay:.5s"/>
<circle class="drop" cx="12" cy="58" r="3" fill="#a5f3fc" style="animation-delay:1s"/>
</g>

<!-- 03 train: mini neural network with forward pulses -->
<g transform="translate(505 0)">
<g fill="none" stroke="#7c9cff" stroke-opacity=".35" stroke-width="1.2">
<path d="M-22 74L0 62M-22 74L0 88M-22 74L0 114M-22 102L0 62M-22 102L0 88M-22 102L0 114M0 62L22 76M0 62L22 100M0 88L22 76M0 88L22 100M0 114L22 76M0 114L22 100"/>
</g>
<g filter="url(#neon)">
<path class="pulse" d="M-22 74L0 62" pathLength="100"/><path class="pulse" d="M-22 74L0 88" pathLength="100"/><path class="pulse" d="M-22 74L0 114" pathLength="100"/>
<path class="pulse" d="M-22 102L0 62" pathLength="100"/><path class="pulse" d="M-22 102L0 88" pathLength="100"/><path class="pulse" d="M-22 102L0 114" pathLength="100"/>
<path class="pulse b" d="M0 62L22 76" pathLength="100"/><path class="pulse b" d="M0 62L22 100" pathLength="100"/><path class="pulse b" d="M0 88L22 76" pathLength="100"/>
<path class="pulse b" d="M0 88L22 100" pathLength="100"/><path class="pulse b" d="M0 114L22 76" pathLength="100"/><path class="pulse b" d="M0 114L22 100" pathLength="100"/>
</g>
<g fill="#0b1226" stroke="#67e8f9" stroke-width="2">
<circle cx="-22" cy="74" r="5"/><circle cx="-22" cy="102" r="5"/>
<circle cx="0" cy="62" r="5"/><circle cx="0" cy="88" r="5"/><circle cx="0" cy="114" r="5"/>
<circle cx="22" cy="76" r="5" stroke="#c4b5fd"/><circle cx="22" cy="100" r="5" stroke="#c4b5fd"/>
</g>
</g>

<!-- 04 evaluate: rising bars + check -->
<g transform="translate(695 0)">
<path d="M-28 116h44" stroke="#67e8f9" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
<rect class="grow" x="-24" y="96" width="9" height="18" rx="2" fill="#22d3ee"/>
<rect class="grow" x="-11" y="82" width="9" height="32" rx="2" fill="#38bdf8" style="animation-delay:.15s"/>
<rect class="grow" x="2" y="70" width="9" height="44" rx="2" fill="#a78bfa" style="animation-delay:.3s"/>
<circle cx="22" cy="64" r="11" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-width="2"/>
<path d="M17 64l4 4 7-8" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- 05 deploy: server rack with blinking LEDs -->
<g transform="translate(885 0)">
<g class="ic"><rect x="-26" y="60" width="52" height="15" rx="3"/><rect x="-26" y="80" width="52" height="15" rx="3"/><rect x="-26" y="100" width="52" height="15" rx="3"/><path d="M4 67.5h14M4 87.5h14M4 107.5h14"/></g>
<circle class="led" cx="-17" cy="67.5" r="2.4" fill="#34d399"/><circle class="led" cx="-9" cy="67.5" r="2.4" fill="#22d3ee" style="animation-delay:.3s"/>
<circle class="led" cx="-17" cy="87.5" r="2.4" fill="#34d399" style="animation-delay:.6s"/><circle class="led" cx="-9" cy="87.5" r="2.4" fill="#22d3ee" style="animation-delay:.9s"/>
<circle class="led" cx="-17" cy="107.5" r="2.4" fill="#34d399" style="animation-delay:.45s"/><circle class="led" cx="-9" cy="107.5" r="2.4" fill="#22d3ee" style="animation-delay:.75s"/>
</g>

<!-- 06 monitor: screen with heartbeat -->
<g transform="translate(1075 0)">
<g class="ic"><rect x="-30" y="58" width="60" height="42" rx="5"/><path d="M-10 112h20M0 100v12"/></g>
<path class="beat" d="M-24 80h10l4-11 6 21 6-15 3 5h19" pathLength="100"/>
</g>
</svg>
