<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Full-Stack &amp; AI Engineer</title>
<desc id="d">An animated neural network: signals flow forward through its layers, layer by layer.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#0d1430"/><stop offset="1" stop-color="#170f36"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="ng"><stop offset="0" stop-color="#67e8f9" stop-opacity=".95"/><stop offset=".45" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;.6 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
<filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
</defs>
<style>
.mono{font-family:'Cascadia Code','SF Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.p{fill:none;stroke:#67e8f9;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:9 120;stroke-dashoffset:11;animation:flow 3s linear infinite}
@keyframes flow{0%{stroke-dashoffset:11}30%{stroke-dashoffset:-100}100%{stroke-dashoffset:-100}}
.g{opacity:.12;animation:act 3s ease-out infinite}
.g1{animation-delay:1s}.g2{animation-delay:2s}.g3{animation-delay:3s}
@keyframes act{0%{opacity:.12}8%{opacity:1}38%{opacity:.12}100%{opacity:.12}}
.n{fill:#0b1226;stroke:#67e8f9;stroke-width:2}
.n3{stroke:#c4b5fd}
.tw{fill:#a5f3fc;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.85}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.orb{animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
</style>
